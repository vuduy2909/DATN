name: Build and Release Jar on Tag

on:
  push:
    tags:
      - 'v*'      

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./start-gym-BE/start-gym-BE/wellness-navigator-gym

    steps:
      - name: 🧾 Checkout source code
        uses: actions/checkout@v3

      - name: 🧰 Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: 💾 Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: 🏗️ Build with Gradle
        run: ./gradlew clean bootJar

      - name: 🔍 Debug build output
        run: |
          echo "=== Current working directory ==="
          pwd
          echo "=== Contents of current directory ==="
          ls -la
          echo "=== Contents of build directory (if exists) ==="
          ls -la build/ || echo "build/ directory does not exist"
          echo "=== Contents of build/libs directory (if exists) ==="
          ls -la build/libs/ || echo "build/libs/ directory does not exist"
          echo "=== Find all .jar files in current directory and subdirectories ==="
          find . -name "*.jar" -type f || echo "No .jar files found"

      - name: 📁 Get JAR file path
        id: get_jar
        run: |
          echo "=== Looking for JAR files in build/libs ==="
          if [ -d "build/libs" ]; then
            JAR_PATH=$(find build/libs -name "*.jar" | head -n 1)
            if [ -n "$JAR_PATH" ]; then
              # Convert to path relative to repository root
              JAR_PATH="start-gym-BE/start-gym-BE/wellness-navigator-gym/$JAR_PATH"
              echo "JAR=$JAR_PATH" >> "$GITHUB_OUTPUT"
              echo "Found JAR at: $JAR_PATH"
            else
              echo "❌ No JAR files found in build/libs directory"
              exit 1
            fi
          else
            echo "❌ build/libs directory does not exist"
            exit 1
          fi

      - name: 🔍 Verify JAR file exists
        working-directory: ./start-gym-BE/start-gym-BE/wellness-navigator-gym
        run: |
          echo "Checking if JAR file exists..."
          echo "From repository root:"
          ls -la "${{ github.workspace }}/${{ steps.get_jar.outputs.JAR }}" || echo "Not found from repo root"
          echo "From working directory:"
          ls -la build/libs/*.jar
          echo "JAR file size: $(stat -c%s build/libs/*.jar)"

      - name: 🚀 Create GitHub Release and Upload JAR
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.get_jar.outputs.JAR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📡 Deploy JAR to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          script: |
            echo "🔄 Preparing deployment directory..."
            mkdir -p ${{ secrets.SSH_APP_DIR }}
            cd ${{ secrets.SSH_APP_DIR }}
            
            echo "🗑️ Backing up and removing old JAR files..."
            if ls *.jar 1> /dev/null 2>&1; then
              mv *.jar backup-$(date +%Y%m%d-%H%M%S).jar || rm -f *.jar
            fi
            
            echo "✅ VPS ready for new JAR deployment"

      - name: 📦 Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          source: ${{ steps.get_jar.outputs.JAR }}
          target: ${{ secrets.SSH_APP_DIR }}
          strip_components: 4
          