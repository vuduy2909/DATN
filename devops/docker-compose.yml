# docker-compose.yml
#version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh          
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PWD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql   
    ports:
      - "3306:3306"              
volumes:
  db_data:
