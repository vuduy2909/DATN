# DISABLE DDL auto-generation - NO automatic table creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

## Hibernate Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.show.sql=false
spring.jpa.properties.hibernate.format_sql=true
# Clear Hibernate cache
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.impl.NoCachingRegionFactory
spring.jpa.properties.javax.persistence.sharedCache.mode=NONE
# Force Hibernate to use physical table name
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# DISABLE DDL generation completely
spring.jpa.generate-ddl=false

# DISABLE Flyway migrations - NO automatic database changes
spring.flyway.enabled=false

# Backup option: Uncomment these lines if foreign key errors persist
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.properties.hibernate.hbm2ddl.auto=validate

# Reduce log verbosity - only show important logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.springframework.transaction=WARN

